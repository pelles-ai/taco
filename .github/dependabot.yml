# Dependabot version updates. Each ecosystem gets at most a few grouped pull
# requests a week, and a release has to be a week old before Dependabot
# proposes it (cooldown). Security updates are not delayed.
version: 2
updates:
  # The workflows pin every action to a commit SHA with the version in a
  # comment; Dependabot moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The SDK declares version ranges, not pins. Only propose a change when a
  # new release falls outside a range (for example a2a-sdk 2.0).
  - package-ecosystem: pip
    directory: /sdk
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
    commit-message:
      prefix: sdk

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ui
    groups:
      # Docusaurus packages have to move in lockstep.
      docusaurus:
        patterns: ["@docusaurus/*"]
      website-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@docusaurus/*"]
        update-types: [minor, patch]
      # One pull request for all security fixes instead of one per package.
      website-security:
        applies-to: security-updates
        patterns: ["*"]
