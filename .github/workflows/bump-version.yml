name: Bump version and publish

# A release is cut only when something under sdk/ changes on main, and only
# after the full test suite passes on that commit. Website-, docs- and
# example-only merges no longer publish a new PyPI version.
#
# The publish job must stay in this file: PyPI trusted publishing is bound
# to this workflow's filename and the `pypi` environment.
on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  bump:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      # Release notes come from CHANGELOG.md: the version's own section, or
      # [Unreleased] if it has not been dated yet. The commit list is the
      # fallback when the changelog has nothing for this release.
      - name: Write release notes
        env:
          NEW_VERSION: ${{ steps.tag_version.outputs.new_version }}
          COMMITS: ${{ steps.tag_version.outputs.changelog }}
        run: |
          python3 .github/scripts/changelog_section.py "$NEW_VERSION" > release-notes.md \
            || printf '%s\n' "$COMMITS" > release-notes.md
      - name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          bodyFile: release-notes.md

  publish:
    needs: bump
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.new_tag }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build
        working-directory: sdk

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk/dist/
