name: Bump version and publish

# A release is cut only when something under sdk/ changes on main, and only
# after the full test suite passes on that commit. Website-, docs- and
# example-only merges no longer publish a new PyPI version.
#
# The publish job must stay in this file: PyPI trusted publishing is bound
# to this workflow's filename and the `pypi` environment.
on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only calculate the next version: no tag, release or PyPI upload"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  bump:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Only main releases. A manual run with dry_run, or any run from
      # another branch, just reports the version it would release.
      DRY_RUN: ${{ format('{0}', inputs.dry_run) == 'true' || github.ref != 'refs/heads/main' }}
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      new_version: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # lets the tag action fall back to local history
      # The bump comes from the commit messages since the last tag: feat →
      # minor, anything else → patch (default_bump). With no commits since
      # the last tag, newer versions of the action create no tag at all, so
      # every later step checks new_tag.
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          default_bump: patch
          dry_run: ${{ env.DRY_RUN }}
      - name: Summarize
        env:
          PREVIOUS_TAG: ${{ steps.tag_version.outputs.previous_tag }}
          NEW_TAG: ${{ steps.tag_version.outputs.new_tag }}
          RELEASE_TYPE: ${{ steps.tag_version.outputs.release_type }}
        run: |
          {
            if [ -z "$NEW_TAG" ]; then
              echo "No new version: no commits to release since ${PREVIOUS_TAG:-the last tag}."
            elif [ "$DRY_RUN" = "true" ]; then
              echo "Dry run: would release $NEW_TAG ($RELEASE_TYPE after $PREVIOUS_TAG). Nothing was tagged or published."
            else
              echo "Releasing $NEW_TAG ($RELEASE_TYPE after $PREVIOUS_TAG)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Release notes come from CHANGELOG.md: the version's own section, or
      # [Unreleased] if it has not been dated yet. The commit list is the
      # fallback when the changelog has nothing for this release.
      - name: Write release notes
        if: steps.tag_version.outputs.new_tag != '' && env.DRY_RUN != 'true'
        env:
          NEW_VERSION: ${{ steps.tag_version.outputs.new_version }}
          COMMITS: ${{ steps.tag_version.outputs.changelog }}
        run: |
          python3 .github/scripts/changelog_section.py "$NEW_VERSION" > release-notes.md \
            || printf '%s\n' "$COMMITS" > release-notes.md
      - name: Create a GitHub release
        if: steps.tag_version.outputs.new_tag != '' && env.DRY_RUN != 'true'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          bodyFile: release-notes.md

  publish:
    needs: bump
    if: >-
      needs.bump.outputs.new_tag != ''
      && format('{0}', inputs.dry_run) != 'true'
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.new_tag }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build
        working-directory: sdk

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk/dist/
