name: Run tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Called by bump-version.yml and pages.yml so a release or a deploy only
  # happens after the full suite passes on the commit being shipped.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install ".[dev]"
        working-directory: sdk

      - name: Ruff check
        run: ruff check taco/ tests/
        working-directory: sdk

      - name: Ruff format check
        run: ruff format --check taco/ tests/
        working-directory: sdk

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install ".[dev]"
        working-directory: sdk

      - name: Mypy
        run: mypy taco/
        working-directory: sdk

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK with test dependencies
        run: pip install ".[test]"
        working-directory: sdk

      - name: Run tests
        run: pytest -v
        working-directory: sdk

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # tags drive the SDK version shown on the site

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: website

      # Also validates every schema example against its schema.
      - name: Build the site
        run: npm run build
        working-directory: website

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the SDK wheel
        run: pip wheel --no-deps ./sdk -w dist

      - name: Run the playground examples in Pyodide
        working-directory: website
        run: |
          version=$(sed -n "s/^export const PYODIDE_VERSION = '\(.*\)';$/\1/p" src/data/playground-presets.js)
          npm install --no-save "pyodide@${version}"
          node scripts/check-playground.mjs ../dist/taco_agent-*.whl
