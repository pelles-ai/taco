name: Run tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Called by bump-version.yml and pages.yml so a release or a deploy only
  # happens after the full suite passes on the commit being shipped.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install ".[dev]"
        working-directory: sdk

      - name: Ruff check
        run: ruff check taco/ tests/
        working-directory: sdk

      - name: Ruff format check
        run: ruff format --check taco/ tests/
        working-directory: sdk

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install ".[dev]"
        working-directory: sdk

      - name: Mypy
        run: mypy taco/
        working-directory: sdk

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK with test dependencies
        run: pip install ".[test]"
        working-directory: sdk

      - name: Run tests
        run: pytest -v
        working-directory: sdk

  # The SDK reaches into a2a-sdk internals, so also test the oldest
  # a2a-sdk release pyproject.toml allows.
  test-min-a2a-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"

      - name: Install SDK with the minimum a2a-sdk and protobuf
        run: pip install ".[test]" "a2a-sdk[http-server]==1.1.1" "protobuf==5.29.5"
        working-directory: sdk

      - name: Run tests
        run: pytest -v
        working-directory: sdk

  # The sandbox demo: lint it, then run it end to end against a fake Claude
  # API (no key needed), including every curl in its README and docstrings.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the SDK and the demo dependencies
        run: pip install -e "sdk[dev]" -r examples/requirements.txt

      - name: Ruff check
        run: ruff check examples/

      - name: Ruff format check
        run: ruff format --check examples/

      - name: Run the demo smoke tests
        run: pytest examples/tests -v

  examples-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the demo image
        run: docker build -f examples/Dockerfile -t taco-demo .

      - name: Check the image can load the demo services
        run: >-
          docker run --rm -e ANTHROPIC_API_KEY=sk-ant-test taco-demo
          python -c "import taco, agents.estimating_agent, orchestrator.app; print(taco.__version__)"

      - name: Validate the compose file
        run: |
          cp examples/.env.example examples/.env
          docker compose -f examples/docker-compose.yml --env-file examples/.env config --quiet

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags drive the SDK version shown on the site

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        run: npm ci
        working-directory: website

      # Also validates every schema example against its schema.
      - name: Build the site
        run: npm run build
        working-directory: website

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build the SDK wheel
        run: pip wheel --no-deps ./sdk -w dist

      # The conformance page's sample is the card A2AServer serves, so it
      # shows what a real agent publishes and must pass every required check.
      - name: Check the sample card is what A2AServer serves
        working-directory: website
        run: |
          pip install "$(ls ../dist/taco_agent-*.whl)[server,client]"
          python scripts/served-card.py | diff -u src/data/sample-agent-card.json - || {
            echo "::error file=website/src/data/sample-agent-card.json::Stale. Run: python scripts/served-card.py > src/data/sample-agent-card.json"
            exit 1
          }

      - name: Check the conformance checks
        working-directory: website
        run: node scripts/check-conformance.mjs

      - name: Run the playground examples in Pyodide
        working-directory: website
        run: |
          version=$(sed -n "s/^export const PYODIDE_VERSION = '\(.*\)';$/\1/p" src/data/playground-presets.js)
          npm install --no-save "pyodide@${version}"
          node scripts/check-playground.mjs ../dist/taco_agent-*.whl
