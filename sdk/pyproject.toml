[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "taco-agent"
dynamic = ["version"]
description = "TACO — The A2A Construction Open-standard SDK"
readme = "../README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.11",
    "a2a-sdk>=1.0.2,<2",
    # a2a-sdk 1.0.2 declares ``protobuf>=5.29.5`` open-ended, but its
    # ``proto_utils._check_required_field_violation`` reads
    # ``FieldDescriptor.label`` which was removed in protobuf 7.x. Pin
    # to the 5.x series until upstream ships a fix.
    "protobuf>=5.29.5,<6",
]

[project.optional-dependencies]
# fastapi is pulled in explicitly because a2a-sdk[http-server] dropped it
# from the extra in v1.0 (it now ships only sse-starlette + starlette).
server = ["a2a-sdk[http-server]>=1.0.2,<2", "fastapi>=0.115"]
client = ["httpx>=0.27"]
test = [
    "pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27",
    "a2a-sdk[http-server]>=1.0.2,<2",
    "fastapi>=0.115",
    "pyyaml>=6.0",
]
langgraph = ["langgraph>=0.2"]
all = ["a2a-sdk[http-server]>=1.0.2,<2", "fastapi>=0.115", "httpx>=0.27"]
dev = [
    "a2a-sdk[http-server]>=1.0.2,<2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "pytest>=8.0", "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
taco = "taco.cli:main"

[project.urls]
Homepage = "https://github.com/pelles-ai/taco"
Documentation = "https://pelles-ai.github.io/taco/"
Repository = "https://github.com/pelles-ai/taco"

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build]
packages = ["taco"]

[tool.hatch.build.hooks.vcs]
version-file = "taco/_version.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["taco/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"taco/monitor/_ui.py" = ["E501"]
"taco/cli.py" = ["B904"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "taco.agent_card"
disable_error_code = ["call-arg"]
